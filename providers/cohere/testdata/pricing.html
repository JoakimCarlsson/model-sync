self.__next_f.push([1,"51:[\"$\",\"$1\",\"d8386f7f3b1e\",{\"children\":[[\"$\",\"$L4b\",null,{\"moduleIds\":[292143]}],[\"$\",\"$L5e\",null,{\"_key\":\"d8386f7f3b1e\",\"_type\":\"web3AccordionSection\",\"accordions\":[{\"_key\":\"2fa98354ba3d\",\"_type\":\"accordion\",\"accordion\":null,\"accordionItemBehavior\":\"canOpenMultipleDrawersAtATime\",\"accordionItems\":[{\"_key\":\"1f24d9f5fba7\",\"_type\":\"accordionItem\",\"headline\":\"How do I inquire about model customization and private deployment?\",\"portableBody\":[{\"_key\":\"05b6f09eafef\",\"_type\":\"block\",\"children\":[{\"_key\":\"a733586062ef\",\"_type\":\"span\",\"text\":\"Cohere supports bespoke model customization for our enterprise customers along with private deployment of all our products. Custom pricing is based on your enterprise needs. Learn more about customization \"},{\"_key\":\"e466895fdedb\",\"_type\":\"span\",\"marks\":[\"7a4a8880e523\"],\"text\":\"here\"},{\"_key\":\"40eb9b28f0db\",\"_type\":\"span\",\"text\":\" and private deployment \"},{\"_key\":\"867fb3c1d1a6\",\"_type\":\"span\",\"marks\":[\"5fe8de9bdf32\"],\"text\":\"here\"},{\"_key\":\"91efc8fa5d61\",\"_type\":\"span\",\"text\":\".\"}],\"markDefs\":[{\"_key\":\"7a4a8880e523\",\"_type\":\"link\",\"href\":\"https://cohere.com/customization\"},{\"_key\":\"5fe8de9bdf32\",\"_type\":\"link\",\"href\":\"https://cohere.com/private-deployments\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"f752f8f12d07\",\"_type\":\"accordionItem\",\"headline\":\"How do I get a Trial API key?\",\"portableBody\":[{\"_key\":\"c4dd4f84ee7b\",\"_type\":\"block\",\"children\":[{\"_key\":\"6f67da52c195\",\"_type\":\"span\",\"text\":\"When an account is created, we automatically create an Trial API key for you. This API key will be available on the dashboard for you to copy, as well as in the dashboard section called “API Keys.”\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"f00f34f9445a\",\"_type\":\"accordionItem\",\"headline\":\"How do I get a Production API key?\",\"portableBody\":[{\"_key\":\"d32b0c4edbba\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ebb3ec32e81\",\"_type\":\"span\",\"text\":\"To get a Production key, you'll need to have Owner privileges (or ask your organization Owner to complete the following steps). Navigate to the Billing and Usage page in your Cohere dashboard. Click on the Get Your Production key button and fill out the Go to Production workflow.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"c73126f145d2\",\"_type\":\"accordionItem\",\"headline\":\"What’s the difference between a Trial API key and Production API key?\",\"portableBody\":[{\"_key\":\"4147387d0011\",\"_type\":\"block\",\"children\":[{\"_key\":\"e29588176996\",\"_type\":\"span\",\"text\":\"API calls made from a Trial API key are free. However, trial keys are rate limited and are not permitted to be used for production or commercial purposes. API calls made from a Production API key will be charged on a pay-as-you-go basis. Production API keys are designed for production use at scale.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"158ca834a392\",\"_type\":\"accordionItem\",\"headline\":\"Are there any account limitations upon signup?\",\"portableBody\":[{\"_key\":\"e5ddde798ada\",\"_type\":\"block\",\"children\":[{\"_key\":\"18417cc37c1d\",\"_type\":\"span\",\"text\":\"Every account begins as a personal account and only has access to Trial API keys. As a personal account, you will not be able to add other members until you become part of an organization.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"4c2aa5f94a54\",\"_type\":\"accordionItem\",\"headline\":\"What’s the difference between an organization and a personal account?\",\"portableBody\":[{\"_key\":\"e4cf254c5a5c\",\"_type\":\"block\",\"children\":[{\"_key\":\"4c2032d9a943\",\"_type\":\"span\",\"text\":\"At Cohere, an organization is a group of personal accounts that share a singular billing portal. Organizations are not automatically given Production API key access, and a member of the organization must still fill out our application form for production access. Personal accounts cannot share billing information with other accounts.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"70cc3aff5235\",\"_type\":\"accordionItem\",\"headline\":\"Which model should I pick?\",\"portableBody\":[{\"_key\":\"9d6fc475b6d6\",\"_type\":\"block\",\"children\":[{\"_key\":\"48ddea7bce09\",\"_type\":\"span\",\"text\":\"Your model selection reflects your relative prioritization of model performance and speed. Larger models offer better performance and are capable of more complex tasks, while smaller models have faster response times.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"5c06811271b4\",\"_type\":\"accordionItem\",\"headline\":\"When do I get billed?\",\"portableBody\":[{\"_key\":\"33322c21f739\",\"_type\":\"block\",\"children\":[{\"_key\":\"97bb4ed2dd37\",\"_type\":\"span\",\"text\":\"API calls made from a Trial API key will be free. API calls made from a Production key will be billed on a pay-as-you-go basis. Your bill will be issued at the end of every calendar month or when you reach $250 in outstanding balances.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"f604ab222a4e\",\"_type\":\"accordionItem\",\"headline\":\"The endpoint I’m using is billed by token. What is a token?\",\"portableBody\":[{\"_key\":\"95a9fd6d3f6c\",\"_type\":\"block\",\"children\":[{\"_key\":\"1997ca61b30e\",\"_type\":\"span\",\"text\":\"Language models understand “tokens” rather than characters or bytes. The number of tokens per word depends on the complexity of the text. Simple text may approach 1 token per word on average, while complex texts may use less common words that require 3-4 tokens per word on average. For more details on tokens, refer to \"},{\"_key\":\"283415301e26\",\"_type\":\"span\",\"marks\":[\"4d9f15b442f2\"],\"text\":\"this page\"},{\"_key\":\"6bb88f42c58c\",\"_type\":\"span\",\"text\":\".\"}],\"markDefs\":[{\"_key\":\"4d9f15b442f2\",\"_type\":\"link\",\"href\":\"https://docs.cohere.com/docs/tokens-and-tokenizers\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"70577d9da5b1\",\"_type\":\"accordionItem\",\"headline\":\"Where do I find pricing for our legacy models?\",\"portableBody\":[{\"_key\":\"b78309a8fd8f\",\"_type\":\"block\",\"children\":[{\"_key\":\"fa50f68b4925\",\"_type\":\"span\",\"text\":\"For existing customers:\"}],\"style\":\"normal\"},{\"_key\":\"4641fb1b4670\",\"_type\":\"block\",\"children\":[{\"_key\":\"55d0a962c6c8\",\"_type\":\"span\",\"text\":\"\"}],\"style\":\"normal\"},{\"_key\":\"8b05b6c416d0\",\"_type\":\"block\",\"children\":[{\"_key\":\"ecefc674312a\",\"_type\":\"span\",\"text\":\"Command pricing is $1.00/1M tokens for input and $2.00/1M tokens for output\"}],\"level\":1,\"listItem\":\"bullet\",\"style\":\"normal\"},{\"_key\":\"43279f9311e1\",\"_type\":\"block\",\"children\":[{\"_key\":\"a1c63b7e39f7\",\"_type\":\"span\",\"text\":\"Command-light pricing is $0.30/1M tokens for input and $0.60/1M
